# CI 门禁:构建 + 静态检查 + 全量测试(需要 PostgreSQL,测试基建见 db/testmain_test.go)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pojun
          POSTGRES_PASSWORD: pojuntest
          POSTGRES_DB: pojun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pojun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POJUN_PG_DSN: postgres://pojun:pojuntest@localhost:5432/pojun_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      # 发布流程直接执行 ./build.sh，README 里的示例是 sudo ./install.sh。用会重写文件的工具
      # （例如经 UNC 路径的编辑器）改过脚本之后，可执行位容易悄悄丢掉——v1.0.0 之后就丢过一次，
      # ci 全绿、直到发版才炸。这里检查工作区的实际权限，不看 git 索引。
      - name: Scripts must stay executable
        run: |
          for f in build.sh install.sh start.sh reset-password.sh dev.sh; do
            [ -x "$f" ] || { echo "::error::$f 没有可执行位：git update-index --chmod=+x $f"; exit 1; }
          done
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # Go module proxy 偶发 stream INTERNAL_ERROR（2026-11-18 v0.4.84 构建失败即此因）。
      # setup-go 的 cache 只在命中时省下载；首次/换 go.sum 仍需拉模块，这里显式重试。
      - name: Download Go modules (retry transient proxy errors)
        run: |
          for i in 1 2 3 4; do
            if go mod download; then exit 0; fi
            echo "go mod download failed (attempt $i), retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -p 1: db/agent/server/evidence 四个包的 TestMain 持有同一把跨包 advisory lock
        # (llmrec/traffic 等不持有),CI 多核并行时与 agent 包写事务死锁
        # (SQLSTATE 40P01,两轮稳定复现)。串行跑包与 TestMain 的锁设计意图一致。
        run: go test -p 1 ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      # lint 暂不进门禁：存量 75 个 error 均为行为级修复（空 catch 补处理、悬浮
      # Promise 补 await、a11y），与最小 diff 原则冲突，留作独立治理任务；
      # build:static 已覆盖 TS 类型检查与静态导出验证。
      - name: Build (static export)
        run: npm run build:static
        working-directory: web
